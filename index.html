<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Plan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="planner">
    <header class="top">
      <h1>WEEKLY PLAN</h1>

      <div class="header-field">
        <label for="week">WEEK OF</label>
        <input id="week" type="text" aria-label="Week of">
      </div>

      <div class="header-field habit-field">
        <label for="habit">HEALTHY HABIT</label>
        <input id="habit" type="text" aria-label="Healthy habit">
      </div>

      <div class="top-checks">
        <label><span>ROCKED IT</span><input type="checkbox"></label>
        <label><span>ROOM FOR IMPROVEMENT</span><input type="checkbox"></label>
      </div>
    </header>

    <aside class="sidebar">
      <section class="side-section goals">
        <h2>TOP 3 GOALS</h2>
        <div class="task-list">
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
        </div>
      </section>

      <section class="side-section everything">
        <h2>EVERYTHING ELSE</h2>
        <div class="task-list">
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
        </div>
      </section>

      <section class="side-section next-week">
        <h2>NEXT WEEK</h2>
        <div class="task-list">
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
          <label class="task"><input type="checkbox"><span contenteditable="true"></span></label>
        </div>
      </section>
    </aside>

    <section class="calendar" aria-label="Weekly calendar">
      <article class="day monday">
        <h2>MONDAY <input type="checkbox" aria-label="Monday completed"></h2>
        <div class="day-notes" contenteditable="true" aria-label="Monday notes"></div>
      </article>
      <article class="day tuesday">
        <h2>TUESDAY <input type="checkbox" aria-label="Tuesday completed"></h2>
        <div class="day-notes" contenteditable="true" aria-label="Tuesday notes"></div>
      </article>
      <article class="day wednesday">
        <h2>WEDNESDAY <input type="checkbox" aria-label="Wednesday completed"></h2>
        <div class="day-notes" contenteditable="true" aria-label="Wednesday notes"></div>
      </article>
      <article class="day thursday">
        <h2>THURSDAY <input type="checkbox" aria-label="Thursday completed"></h2>
        <div class="day-notes" contenteditable="true" aria-label="Thursday notes"></div>
      </article>
      <article class="day friday">
        <h2>FRIDAY <input type="checkbox" aria-label="Friday completed"></h2>
        <div class="day-notes" contenteditable="true" aria-label="Friday notes"></div>
      </article>
      <article class="day saturday">
        <h2>SATURDAY <input type="checkbox" aria-label="Saturday completed"></h2>
        <div class="day-notes" contenteditable="true" aria-label="Saturday notes"></div>
      </article>
      <article class="day sunday">
        <h2>SUNDAY <input type="checkbox" aria-label="Sunday completed"></h2>
        <div class="day-notes" contenteditable="true" aria-label="Sunday notes"></div>
      </article>
    </section>

    <footer class="bottom-bar"></footer>
  </main>
</body>
</html>
